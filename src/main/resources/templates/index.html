<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - Moving' : 'Moving - Xem Phim Online'}"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --netflix-red: #e50914; --bg-dark: #141414; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Be Vietnam Pro', sans-serif; overflow-x: hidden; }

        .section-title {
            font-size: 1.5rem; font-weight: 700; margin: 2rem 0;
            border-left: 5px solid var(--netflix-red); padding-left: 15px; color: #eee;
        }

        /* Card Phim Nâng Cấp */
        .movie-card {
            background: #1f1f1f; border-radius: 10px; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid #2a2a2a; position: relative;
        }

        .movie-card:hover {
            transform: scale(1.05); z-index: 5;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
            border-color: var(--netflix-red);
        }

        .movie-img-container {
            position: relative; aspect-ratio: 2/3; overflow: hidden;
            background: #2a2a2a; /* Lớp nền khi ảnh chưa load */
        }

        .movie-card img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .movie-card:hover img { filter: brightness(0.8); }

        /* Badge thông tin */
        .badge-status {
            position: absolute; top: 10px; left: 10px;
            background: var(--netflix-red); color: white;
            font-size: 0.7rem; padding: 3px 8px; border-radius: 5px;
            font-weight: 700; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .badge-year {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.75); color: #ffc107;
            font-size: 0.7rem; padding: 3px 8px; border-radius: 5px;
            z-index: 10; backdrop-filter: blur(5px);
        }

        .movie-info { padding: 12px 8px; text-align: center; }
        .movie-title {
            font-weight: 600; font-size: 0.95rem; line-height: 1.3;
            height: 2.6rem; display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden; color: #fff;
        }

        /* Phân trang xịn */
        .pagination .page-link {
            background-color: #1f1f1f; border-color: #333; color: #aaa;
            margin: 0 5px; border-radius: 8px !important; transition: 0.3s;
        }

        .pagination .page-item.active .page-link {
            background-color: var(--netflix-red); border-color: var(--netflix-red); color: white;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.3);
        }

        .pagination .page-link:hover { background-color: var(--netflix-red); color: white; }

        /* Play icon hover effect */
        .play-icon {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            font-size: 3rem; color: white; transition: 0.3s; opacity: 0.8;
        }
        .movie-card:hover .play-icon { transform: translate(-50%, -50%) scale(1); }
    </style>
</head>
<body>

<div th:replace="~{header :: moving-header}"></div>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="section-title" th:text="${title != null ? title : 'Phim Mới Cập Nhật'}"></h1>
    </div>

    <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 row-cols-xl-6 g-3 g-md-4">
        <div class="col" th:each="movie : ${movies}">
            <a th:href="@{/phim/{slug}(slug=${movie.slug})}" class="text-decoration-none">
                <div class="movie-card">
                    <span class="badge-status" th:text="${movie?.episode_current ?: 'HD'}"></span>
                    <span class="badge-year" th:text="${movie?.year}"></span>

                    <div class="movie-img-container">
                        <img th:src="${'https://img.ophim.live/uploads/movies/' + movie.thumb_url}"
                             th:alt="${movie.name}" onerror="this.src='/images/no-poster.jpg'" loading="lazy">
                        <div class="play-icon"><i class="fas fa-play-circle"></i></div>
                    </div>

                    <div class="movie-info">
                        <div class="movie-title" th:text="${movie.name}"></div>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <nav class="mt-5" th:if="${currentPage != null}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="${currentCategory != null} ? @{/filter/{cat}/{slug}(cat=${currentCategory}, slug=${currentSlug}, page=${currentPage - 1})} : @{/(page=${currentPage - 1})}">
                    <i class="fas fa-chevron-left"></i>
                </a>
            </li>

            <li class="page-item active">
                <span class="page-link" th:text="${currentPage}"></span>
            </li>

            <li class="page-item">
                <a class="page-link" th:href="${currentCategory != null} ? @{/filter/{cat}/{slug}(cat=${currentCategory}, slug=${currentSlug}, page=${currentPage + 1})} : @{/(page=${currentPage + 1})}">
                    <i class="fas fa-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
