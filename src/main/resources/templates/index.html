<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Moving - Xem Phim Mới</title>
    <style>
        body { background-color: #141414; color: white; font-family: sans-serif; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .movie-card { background: #222; border-radius: 8px; overflow: hidden; transition: transform 0.3s; }
        .movie-card:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(229,9,20,0.4); }
        .movie-card img { width: 100%; height: 300px; object-fit: cover; }
        .movie-info { padding: 10px; }
        .movie-title { font-weight: bold; font-size: 14px; margin-bottom: 5px; }
    </style>
</head>
<body>

<nav th:fragment="nav" style="background: #000; padding: 15px 5%; display: flex; align-items: center; gap: 30px; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #333;">
    <style>
        .dropdown { position: relative; }
        .dropdown-content {
            display: none; position: absolute; background: #1a1a1a;
            width: 550px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 9999;
            padding: 15px; border-radius: 8px; top: 100%; left: 0;
            grid-template-columns: repeat(3, 1fr); gap: 10px;
        }
        .dropdown:hover .dropdown-content { display: grid; }
        .dropdown-content a {
            color: #ccc !important; padding: 8px 12px; text-decoration: none;
            font-size: 13px; border-radius: 4px; display: block;
        }
        .dropdown-content a:hover { background-color: #e50914 !important; color: white !important; }
        nav a:hover { color: #e50914 !important; transition: 0.3s; }
    </style>

    <a href="/" style="color: #e50914; font-size: 26px; font-weight: bold; text-decoration: none;">MOVING</a>

    <div style="display: flex; gap: 25px; align-items: center;">
        <a href="/filter/danh-sach/phim-moi" style="color: #ccc; text-decoration: none;">Phim Mới</a>

        <div class="dropdown">
            <span style="color: #ccc; cursor: pointer;">Thể Loại ▾</span>
            <div class="dropdown-content">
                <a th:each="g : ${allGenres}" th:href="@{/filter/the-loai/{slug}(slug=${g.slug})}" th:text="${g.name}"></a>
            </div>
        </div>

        <div class="dropdown">
            <span style="color: #ccc; cursor: pointer;">Quốc Gia ▾</span>
            <div class="dropdown-content">
                <a th:each="c : ${allCountries}" th:href="@{/filter/quoc-gia/{slug}(slug=${c.slug})}" th:text="${c.name}"></a>
            </div>
        </div>
    </div>

    <form action="/search" method="get" style="margin-left: auto;">
        <input type="text" name="keyword" placeholder="Tìm phim..." style="padding: 8px 15px; border-radius: 20px; border: none; background: #222; color: white; outline: none; width: 180px;">
    </form>
</nav>

<div class="container">
    <h1 th:text="${title != null ? title : 'Phim Mới Cập Nhật'}"></h1>
    <div class="movie-grid">
        <div class="movie-card" th:each="movie : ${movies}">
            <a th:href="@{/phim/{slug}(slug=${movie.slug})}" style="text-decoration: none; color: inherit;">
                <img th:src="${'https://img.ophim.live/uploads/movies/' + movie.thumb_url}" alt="poster">
                <div class="movie-info">
                    <div class="movie-title" th:text="${movie.name}"></div>
                </div>
            </a>
        </div>
    </div>
</div>
</body>
</html>
