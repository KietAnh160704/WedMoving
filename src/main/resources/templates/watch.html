<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="'Đang xem: ' + ${movie.name} + ' - Moving'"></title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root { --primary-red: #e50914; --bg-black: #0a0a0a; --card-dark: #1a1a1a; }
    body { background-color: var(--bg-black); color: white; font-family: 'Be Vietnam Pro', sans-serif; transition: 0.3s; }

    /* Player Wrapper */
    .video-container { background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #222; transition: all 0.5s ease; }
    .player-ratio { position: relative; padding-bottom: 56.25%; height: 0; }
    .player-ratio iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    /* Nút & Control */
    .control-box { background: var(--card-dark); border-radius: 12px; padding: 20px; margin-top: 20px; border: 1px solid #333; }
    .btn-custom { border: 1px solid #444; background: #252525; color: #ccc; padding: 8px 16px; border-radius: 6px; font-weight: 500; transition: 0.3s; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
    .btn-custom:hover { background: #333; color: white; border-color: #666; }
    .btn-custom.active { background: var(--primary-red); color: white; border-color: var(--primary-red); box-shadow: 0 4px 12px rgba(229,9,20,0.3); }

    .episode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 10px; }
    .section-label { color: #888; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .movie-title-watch { font-weight: 700; background: linear-gradient(to right, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* CSS Tắt đèn */
    #light-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.96); z-index: 1040; display: none; }
    .video-container.lighting-off { position: relative; z-index: 1050; box-shadow: 0 0 60px rgba(229, 9, 20, 0.4); border: 1px solid var(--primary-red); }
    .btn-light-toggle { background: #222; color: #ffc107; border: 1px solid #444; transition: 0.3s; position: relative; }
    .btn-light-toggle.active { z-index: 1051; background: #ffc107; color: #000; }

    @media (max-width: 576px) {
        .episode-grid { grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); gap: 8px; }
    }
  </style>
</head>
<body>

<div id="light-overlay" onclick="toggleLights()"></div>

<div th:replace="~{header :: moving-header}"></div>

<div class="container my-4 my-md-5">
  <div class="video-container shadow-2-strong">
    <div class="player-ratio">
      <iframe th:src="${currentLink}" allowfullscreen></iframe>
    </div>
  </div>

  <div class="mt-4 d-flex justify-content-between align-items-center flex-wrap">
    <div>
      <h2 class="movie-title-watch mb-1" th:text="${movie.name}"></h2>
      <p class="text-secondary small mb-0"><i class="fas fa-eye me-1"></i> Đang có hàng nghìn người cùng xem</p>
    </div>
    <div class="mt-3 mt-md-0">
      <button class="btn btn-light-toggle rounded-pill px-4 me-2 shadow-none" onclick="toggleLights()">
        <i class="fas fa-lightbulb me-2"></i> <span id="light-text">Tắt đèn</span>
      </button>

      <button class="btn btn-dark border-secondary rounded-pill px-4 me-2">
        <i class="fas fa-share-alt me-2"></i>Chia sẻ
      </button>
      <button class="btn btn-outline-danger rounded-pill px-4">
        <i class="fas fa-heart"></i>
      </button>
    </div>
  </div> <hr class="my-4 border-secondary opacity-25">

  <div class="row g-4">
    <div class="col-12 col-lg-4">
      <div class="control-box">
        <p class="section-label mb-3"><i class="fas fa-layer-group me-2"></i>Chọn Server</p>
        <div class="d-flex flex-column gap-2">
          <a th:each="sv, iter : ${movie.episodes}"
             th:href="@{/xem-phim/{slug}(slug=${movie.slug}, sv=${iter.index})}"
             class="btn-custom w-100 justify-content-start"
             th:classappend="${selectedSv == iter.index} ? 'active' : ''">
            <i class="fas fa-server me-3 small"></i>
            <span th:text="${sv.server_name}"></span>
          </a>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-8">
      <div class="control-box">
        <p class="section-label mb-3"><i class="fas fa-list me-2"></i>Danh sách tập</p>
        <div class="episode-grid">
          <a th:each="epItem : ${currentServer.server_data}"
             th:href="@{/xem-phim/{slug}(slug=${movie.slug}, ep=${epItem.slug}, sv=${selectedSv})}"
             class="btn-custom"
             th:classappend="${currentEpSlug == epItem.slug} ? 'active' : ''"
             th:text="${epItem.name}">
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="alert alert-dark mt-4 border-secondary bg-black text-secondary small">
    <i class="fas fa-exclamation-triangle me-2"></i> Nếu phim không tải được, vui lòng đổi <strong>Server</strong>.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  function toggleLights() {
      const overlay = document.getElementById('light-overlay');
      const player = document.querySelector('.video-container');
      const btn = document.querySelector('.btn-light-toggle');
      const text = document.getElementById('light-text');

      if (overlay.style.display === 'none' || overlay.style.display === '') {
          overlay.style.display = 'block';
          player.classList.add('lighting-off');
          btn.classList.add('active');
          text.innerText = 'Bật đèn';
          player.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
          overlay.style.display = 'none';
          player.classList.remove('lighting-off');
          btn.classList.remove('active');
          text.innerText = 'Tắt đèn';
      }
  }
</script>

</body>
</html>
