<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="moving-header">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6G8P923RSQ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-6G8P923RSQ');
    </script>

    <style>
        :root {
            --netflix-red: #e50914;
            --dark-gray: #181818;
            --text-gray: #ccc;
        }

        /* Navbar Glassmorphism */
        .navbar-custom {
            background: rgba(0, 0, 0, 0.9) !important;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 0;
            transition: all 0.3s ease;
        }

        .navbar-brand-custom {
            color: var(--netflix-red) !important;
            font-weight: 900;
            font-size: 1.8rem;
            letter-spacing: -1px;
            transition: 0.3s;
        }

        .navbar-brand-custom:hover {
            text-shadow: 0 0 15px var(--netflix-red);
            transform: scale(1.05);
        }

        /* Link Menu */
        .nav-link-custom {
            color: var(--text-gray) !important;
            font-size: 14.5px;
            font-weight: 500;
            margin: 0 10px;
            transition: 0.3s;
        }

        .nav-link-custom:hover {
            color: var(--netflix-red) !important;
        }

        /* Mega Dropdown Menu */
        .dropdown-menu-dark {
            background: var(--dark-gray) !important;
            border: 1px solid #333 !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px !important;
        }

        .dropdown-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            min-width: 450px;
        }

        .dropdown-item-custom {
            color: #aaa !important;
            font-size: 13.5px;
            padding: 8px 12px;
            border-radius: 6px;
            transition: 0.2s;
        }

        .dropdown-item-custom:hover {
            background: var(--netflix-red) !important;
            color: white !important;
            transform: translateX(5px);
        }

        /* Search Box */
        .search-input {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid #444 !important;
            color: white !important;
            border-radius: 20px !important;
            padding-left: 20px;
            font-size: 14px;
            transition: 0.3s;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.15) !important;
            border-color: var(--netflix-red) !important;
            box-shadow: none;
            width: 280px;
        }

        .btn-donate {
            color: #ffc107 !important;
            font-weight: bold;
            border: 1px solid #ffc107;
            border-radius: 20px;
            padding: 5px 15px !important;
            margin-left: 15px;
        }

        .btn-donate:hover {
            background: #ffc107;
            color: black !important;
            box-shadow: 0 0 10px #ffc107;
        }

        @media (max-width: 992px) {
            .dropdown-grid { grid-template-columns: repeat(2, 1fr); min-width: 100%; }
            .navbar-collapse { background: #111; padding: 20px; border-radius: 15px; margin-top: 15px; }
            .search-input:focus { width: 100%; }
        }
    </style>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top navbar-custom">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand navbar-brand-custom" href="/">A.KIỆT</a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#movingNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="movingNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom" href="/filter/danh-sach/phim-moi">PHIM MỚI</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle nav-link-custom" href="#" data-bs-toggle="dropdown">THỂ LOẠI</a>
                        <div class="dropdown-menu dropdown-menu-dark">
                            <div class="dropdown-grid">
                                <div th:each="g : ${allGenres}">
                                    <a class="dropdown-item dropdown-item-custom" th:href="@{/filter/the-loai/{slug}(slug=${g.slug})}" th:text="${g.name}"></a>
                                </div>
                            </div>
                        </div>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle nav-link-custom" href="#" data-bs-toggle="dropdown">QUỐC GIA</a>
                        <div class="dropdown-menu dropdown-menu-dark">
                            <div class="dropdown-grid">
                                <div th:each="c : ${allCountries}">
                                    <a class="dropdown-item dropdown-item-custom" th:href="@{/filter/quoc-gia/{slug}(slug=${c.slug})}" th:text="${c.name}"></a>
                                </div>
                            </div>
                        </div>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link btn-donate" href="#" data-bs-toggle="modal" data-bs-target="#donateModal">
                            <i class="fas fa-coffee me-1"></i> DONATE
                        </a>
                    </li>
                </ul>

                <form action="/search" method="get" class="d-flex">
                    <div class="position-relative">
                        <input class="form-control search-input" type="search" name="keyword" placeholder="Tìm tên phim...">
                        <button class="btn position-absolute end-0 top-0 text-secondary border-0" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </nav>
</div>
</html>
