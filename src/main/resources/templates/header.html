<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="moving-header">
    <nav style="background: #000; padding: 15px 5%; display: flex; align-items: center; gap: 30px; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #333;">
        <a href="/" style="color: #e50914; font-size: 26px; font-weight: bold; text-decoration: none;">MOVING</a>

        <div style="display: flex; gap: 25px; align-items: center;">
            <a href="/filter/danh-sach/phim-moi" style="color: #ccc; text-decoration: none; font-size: 14px;">Phim Mới</a>

            <div class="dropdown">
                <span style="color: #ccc; cursor: pointer; font-size: 14px;">Thể Loại ▾</span>
                <div class="dropdown-content">
                    <a th:each="g : ${allGenres}"
                       th:href="@{/filter/the-loai/{slug}(slug=${g.slug})}"
                       th:text="${g.name}"></a>
                </div>
            </div>

            <div class="dropdown">
                <span style="color: #ccc; cursor: pointer; font-size: 14px;">Quốc Gia ▾</span>
                <div class="dropdown-content">
                    <a th:each="c : ${allCountries}"
                       th:href="@{/filter/quoc-gia/{slug}(slug=${c.slug})}"
                       th:text="${c.name}"></a>
                </div>
            </div>
        </div>

        <form action="/search" method="get" style="margin-left: auto; display: flex; gap: 10px;">
            <input type="text" name="keyword" placeholder="Tìm tên phim..."
                   style="padding: 8px 15px; border-radius: 20px; border: 1px solid #444; background: #222; color: white; outline: none; width: 200px;">
        </form>
    </nav>

    <style>
        .dropdown { position: relative; }
        .dropdown-content {
            display: none; position: absolute; background: #1a1a1a;
            width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 9999; padding: 15px; border-radius: 8px; top: 100%; left: 0;
            grid-template-columns: repeat(3, 1fr); gap: 10px;
        }
        .dropdown:hover .dropdown-content { display: grid; }
        .dropdown-content a {
            color: #ccc !important; padding: 8px; text-decoration: none;
            font-size: 13px; border-radius: 4px; transition: 0.2s;
        }
        .dropdown-content a:hover { background-color: #e50914 !important; color: white !important; }
        nav a:hover { color: #e50914 !important; transition: 0.3s; }
    </style>
</div>
</html>
