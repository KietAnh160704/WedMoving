<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${movie?.name} + ' - Moving'"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary-red: #e50914; --dark-bg: #060606; }
        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Be Vietnam Pro', sans-serif;
            overflow-x: hidden;
        }

        /* Hiệu ứng ảnh nền mờ cực sang */
        .backdrop-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            z-index: -1; overflow: hidden;
        }
        .backdrop-img {
            width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: blur(40px) brightness(0.25);
            transform: scale(1.1); /* Tránh viền trắng khi blur */
        }

        /* Poster tinh tế */
        .movie-poster-detail {
            width: 100%; border-radius: 16px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Khung nội dung Glassmorphism */
        .detail-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .movie-title-big {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            color: #fff;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .movie-meta-item {
            background: rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #eee;
            margin-right: 8px;
            margin-bottom: 8px;
            display: inline-block;
        }

        .content-summary {
            color: #ccc;
            line-height: 1.8;
            font-size: 1rem;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 30px;
            padding-right: 10px;
        }
        /* Custom scrollbar cho nội dung dài */
        .content-summary::-webkit-scrollbar { width: 4px; }
        .content-summary::-webkit-scrollbar-thumb { background: var(--primary-red); border-radius: 10px; }

        /* Nút Server chuyên nghiệp */
        .btn-server {
            background: rgba(255,255,255,0.1);
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-server:hover {
            background: var(--primary-red);
            transform: translateY(-3px);
            color: white;
            box-shadow: 0 10px 20px rgba(229, 9, 20, 0.3);
        }

        @media (max-width: 991px) {
            .detail-glass { padding: 25px; margin-top: 20px; }
            .movie-poster-detail { max-width: 280px; margin: 0 auto 30px; display: block; }
            .movie-title-big { text-align: center; }
            .meta-wrapper { text-align: center; }
            .server-wrapper { justify-content: center; }
        }
    </style>
</head>
<body>

<div th:replace="~{header :: moving-header}"></div>

<div class="backdrop-wrapper">
    <div class="backdrop-img" th:style="'background-image: url(https://img.ophim.live/uploads/movies/' + ${movie?.thumb_url} + ')'"></div>
</div>

<div class="container my-lg-5 py-5">
    <div class="row g-lg-5 align-items-start">
        <div class="col-lg-4 col-xl-4">
            <img th:src="${'https://img.ophim.live/uploads/movies/' + movie?.thumb_url}"
                 class="movie-poster-detail" alt="poster">
        </div>

        <div class="col-lg-8 col-xl-8">
            <div class="detail-glass shadow-lg">
                <h1 class="movie-title-big" th:text="${movie?.name}"></h1>
                <p class="fs-5 text-secondary fw-light mb-4" th:text="${movie?.origin_name}"></p>

                <div class="meta-wrapper mb-4">
                    <span class="movie-meta-item" th:each="cat : ${movie?.category}" th:text="${cat.name}"></span>
                    <span class="movie-meta-item"><i class="far fa-calendar-alt me-1"></i> <th:block th:text="${movie?.year}"></th:block></span>
                    <span class="movie-meta-item text-warning fw-bold"><i class="fas fa-star me-1"></i> <th:block th:text="${movie?.quality}"></th:block></span>
                </div>

                <div class="content-summary mb-5">
                    <h5 class="text-white fw-bold mb-3"><i class="fas fa-info-circle me-2 text-danger"></i>Nội dung phim</h5>
                    <div th:utext="${movie?.content}"></div>
                </div>

                <div class="server-section">
                    <h5 class="mb-3 fw-bold text-white">Chọn ngôn ngữ & Server:</h5>
                    <div class="d-flex gap-3 flex-wrap server-wrapper">
                        <a th:each="server, iter : ${movie?.episodes}"
                           th:href="@{/xem-phim/{slug}(slug=${movie?.slug}, sv=${iter.index})}"
                           class="btn-server shadow-sm">
                            <i class="fas fa-play-circle fs-4 text-danger"></i>
                            <span th:text="${server.server_name}"></span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
